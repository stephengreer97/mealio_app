name: iOS Maestro

# Runs Maestro UI flows against an iOS Simulator on a free GitHub-hosted
# macOS runner. Triggered on PRs into main and on direct pushes to main.
#
# Cost note: macos-latest minutes are billed at 10x the standard rate on
# private GitHub Actions plans (~30 min run = ~300 effective minutes).
# Free tier on private repos is 2000 min/month, so this fits ~6-7 runs.
# Public repos are free — no quota concern.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual run

# Cancel an in-flight run if a new commit lands on the same branch.
concurrency:
  group: ios-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-maestro:
    name: iOS Simulator + Maestro flows
    # macos-15 ships Xcode 16.x — React Native requires >= 16.1.
    # (macos-14's default 15.4 fails pod install.)
    runs-on: macos-15
    # Release xcodebuild of an RN app takes 25-35 min cold on these runners;
    # pods + deps consume ~10 more. 35 min was hit mid-build.
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Generates the ios/ folder from the Expo managed config.
      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      # Cache CocoaPods derived deps so subsequent runs skip the slow install.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Boot iOS Simulator
        run: |
          # Don't hardcode device/runtime versions — pick the first available
          # iPhone simulator on whatever Xcode this runner image ships.
          DEVICE_ID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for devs in d.values() for dev in devs if 'iPhone' in dev['name']))")
          echo "Simulator UDID: $DEVICE_ID"
          echo "SIM_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build for iOS Simulator
        run: |
          # Workspace name is derived from the name in app.json ("Mealio").
          # Single invocation, -quiet to keep the log readable. (An earlier
          # `| xcpretty || (xcodebuild …)` fallback pattern caused a full
          # SECOND build when xcpretty was missing — never do that.)
          set -o pipefail
          xcodebuild \
            -workspace ios/Mealio.xcworkspace \
            -scheme Mealio \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Install app on simulator
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -maxdepth 2 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

      # Maestro discovers and runs every .yaml in the flows folder.
      - name: Run Maestro flows
        run: maestro test tests/maestro/flows --format junit --output maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/

      - name: Upload simulator screenshot on failure
        if: failure()
        run: |
          xcrun simctl io booted screenshot failure-screenshot.png || true
        continue-on-error: true

      - name: Upload screenshot artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: failure-screenshot.png
