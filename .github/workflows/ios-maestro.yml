name: iOS Maestro

# Runs Maestro UI flows against an iOS Simulator using a PREBUILT app from
# EAS Build — GitHub never compiles the app.
#
# Two jobs so billed macOS time stays minimal (~10 min):
#   1. wait-for-eas (ubuntu, 1x billing): finds the EAS ios-simulator build
#      for THIS commit. If one is in progress, waits for it. If none exists
#      for the commit, falls back to the latest finished build with a
#      warning (smoke-test semantics). Outputs the artifact URL.
#   2. ios-maestro (macos, 10x billing): starts only once an artifact is
#      ready — downloads, installs on a simulator, runs the flows.
#
# Kick a commit-exact build with:
#   eas build --platform ios --profile ios-simulator --no-wait
# (per the standing workflow, the engineer does this whenever app code
# changes; flow-only changes can ride the fallback.)
#
# Requires the EXPO_TOKEN repo secret (expo.dev → Account settings →
# Access tokens).

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-eas:
    name: Find / wait for EAS simulator build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    outputs:
      build_url: ${{ steps.find.outputs.build_url }}
    steps:
      - name: Guard — EXPO_TOKEN present
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create an access token at https://expo.dev/accounts/mealio/settings/access-tokens and add it as a repo secret named EXPO_TOKEN."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # eas-cli evaluates app.json config plugins (expo-image-picker, …),
      # which requires the project's node_modules even for read-only
      # commands like build:list.
      - name: Install npm dependencies
        run: npm ci

      - name: Find or wait for the simulator build
        id: find
        run: |
          # On pull_request events github.sha is the synthetic merge commit;
          # the EAS build (kicked locally) carries the branch HEAD sha.
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Target commit: $TARGET_SHA"
          URL=""
          for i in $(seq 1 40); do
            BUILDS=$(npx eas-cli build:list \
              --platform ios \
              --build-profile ios-simulator \
              --limit 10 \
              --json --non-interactive)

            # 1. Finished build for exactly this commit?
            URL=$(echo "$BUILDS" | jq -r --arg sha "$TARGET_SHA" \
              '[.[] | select(.gitCommitHash==$sha and .status=="FINISHED")][0].artifacts.buildUrl // empty')
            [ -n "$URL" ] && { echo "Found commit-exact finished build."; break; }

            # 2. Build for this commit still running? Wait for it.
            INPROG=$(echo "$BUILDS" | jq -r --arg sha "$TARGET_SHA" \
              '[.[] | select(.gitCommitHash==$sha and (.status=="IN_PROGRESS" or .status=="IN_QUEUE" or .status=="NEW" or .status=="PENDING"))] | length')
            if [ "$INPROG" != "0" ]; then
              echo "EAS build for $TARGET_SHA in progress — waiting (attempt $i/40)…"
              sleep 60
              continue
            fi

            # 3. No build for this commit at all — fall back to latest finished.
            URL=$(echo "$BUILDS" | jq -r \
              '[.[] | select(.status=="FINISHED")][0].artifacts.buildUrl // empty')
            if [ -n "$URL" ]; then
              echo "::warning::No EAS build for commit $TARGET_SHA — using the latest finished simulator build (may not include this commit's changes)."
            fi
            break
          done
          if [ -z "$URL" ]; then
            echo "::error::No usable EAS ios-simulator build. Kick one with: eas build --platform ios --profile ios-simulator"
            exit 1
          fi
          echo "build_url=$URL" >> "$GITHUB_OUTPUT"

  ios-maestro:
    name: iOS Simulator + Maestro flows
    needs: wait-for-eas
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EAS simulator build
        run: |
          curl -fsSL "${{ needs.wait-for-eas.outputs.build_url }}" -o /tmp/mealio-sim.tar.gz
          mkdir -p /tmp/mealio-app
          tar xzf /tmp/mealio-sim.tar.gz -C /tmp/mealio-app
          APP_PATH=$(find /tmp/mealio-app -maxdepth 2 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found inside the EAS artifact."
            find /tmp/mealio-app -maxdepth 3 | head -20
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Install Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for devs in d.values() for dev in devs if 'iPhone' in dev['name']))")
          echo "Simulator UDID: $DEVICE_ID"
          echo "SIM_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install app on simulator
        run: xcrun simctl install "$SIM_UDID" "$APP_PATH"

      # The app is occasionally killed on a cold launch on the memory-constrained
      # CI runner (surfaced as "App crashed or stopped", with NO co.mealio.app
      # crash report — host memory pressure, not a code crash). Running all 7
      # flows in one session let that pressure accumulate until a later flow
      # died.
      #
      # Fix: free host memory BEFORE each flow with `sudo purge` (frees cached/
      # inactive RAM) and kill any lingering app process. This is cheap and,
      # crucially, does NOT reboot/erase the simulator — so the XCTest driver
      # stays installed and only the first flow pays driver-startup cost.
      # (Erasing the sim between flows forced a driver reinstall each time and
      # blew the timeout.) A single per-flow retry remains as a backstop.
      - name: Run Maestro flows
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
          # Test account for the mock-store cart flows (regular tier → no 2FA).
          MEALIO_TEST_EMAIL: ${{ secrets.MEALIO_TEST_EMAIL }}
          MEALIO_TEST_PASSWORD: ${{ secrets.MEALIO_TEST_PASSWORD }}
        run: |
          FAILED=""
          for flow in tests/maestro/flows/*.yaml; do
            name=$(basename "$flow" .yaml)
            echo "::group::Maestro $name"
            sudo purge || true
            xcrun simctl terminate "$SIM_UDID" co.mealio.app 2>/dev/null || true
            if ! maestro test "$flow" --format junit --output "report-$name.xml"; then
              echo "::warning::$name failed — purging and retrying once."
              sudo purge || true
              xcrun simctl terminate "$SIM_UDID" co.mealio.app 2>/dev/null || true
              if ! maestro test "$flow" --format junit --output "report-$name.xml"; then
                FAILED="$FAILED $name"
              fi
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Failed flows:$FAILED"
            exit 1
          fi

      # Bring-up: run the mock-store cart flows (still in tests/mock-store/maestro/,
      # not the required tests/maestro/flows/). Non-blocking so a selector we're
      # still tuning doesn't fail the required suite. Maestro's --debug-output
      # captures a screenshot + the full view hierarchy at the failure point, which
      # is how we pick the right selectors without a local simulator. Starts with
      # the happy path; expand to 11–15 (and move into flows/) once it's green.
      - name: Run mock-store cart flows (bring-up, non-blocking)
        if: always()
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
          MEALIO_TEST_EMAIL: ${{ secrets.MEALIO_TEST_EMAIL }}
          MEALIO_TEST_PASSWORD: ${{ secrets.MEALIO_TEST_PASSWORD }}
        run: |
          # Maestro does NOT import shell env into ${...} interpolation; the creds
          # must be passed as params with -e, or the flow's
          # `env: { EMAIL: ${MEALIO_TEST_EMAIL} }` resolves to the literal string
          # "undefined" (which is what landed in the email field).
          run_flow() {
            maestro test "$1" \
              -e MEALIO_TEST_EMAIL="$MEALIO_TEST_EMAIL" \
              -e MEALIO_TEST_PASSWORD="$MEALIO_TEST_PASSWORD" \
              --debug-output "mockstore-debug/$2"
          }
          for flow in tests/mock-store/maestro/*.yaml; do
            name=$(basename "$flow" .yaml)
            echo "::group::mock-store $name"
            sudo purge || true
            xcrun simctl terminate "$SIM_UDID" co.mealio.app 2>/dev/null || true
            # One retry: inputText on the memory-pressured runner occasionally
            # corrupts/reorders characters (e.g. the email), which is a transient
            # flake rather than a real selector issue.
            if ! run_flow "$flow" "$name"; then
              echo "::warning::$name failed — purging and retrying once."
              sudo purge || true
              xcrun simctl terminate "$SIM_UDID" co.mealio.app 2>/dev/null || true
              run_flow "$flow" "$name" \
                || echo "::warning::$name failed (bring-up) — see the mockstore-debug artifact"
            fi
            echo "::endgroup::"
          done

      - name: Upload mock-store debug (screenshots + view hierarchy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mockstore-debug
          path: mockstore-debug
          # Maestro writes the screenshot + view hierarchy under a hidden
          # `.maestro/` dir; without this they're silently skipped ("No files
          # were found"), which is why earlier debug uploads were empty.
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            report-*.xml
            ~/.maestro/tests/

      # PM acceptance surface: PNGs saved by 04-screenshot-tour.yaml. Review
      # the app's current screens straight from the PR's artifacts.
      - name: Upload screenshot tour
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-tour
          path: tour-*.png
          if-no-files-found: ignore

      - name: Screenshot on failure
        if: failure()
        run: xcrun simctl io booted screenshot failure-screenshot.png || true
        continue-on-error: true

      # When Maestro reports "App crashed or stopped", the real stack lives in
      # the simulator's crash reports. Collect them so launch crashes are
      # diagnosable from the run page instead of needing a local repro.
      - name: Collect crash reports on failure
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/* crash-reports/ 2>/dev/null || true
          ls -la crash-reports || true

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: crash-reports/
          if-no-files-found: ignore

      - name: Upload screenshot artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: failure-screenshot.png
