name: iOS Maestro

# Runs Maestro UI flows against an iOS Simulator using a PREBUILT app from
# EAS Build — GitHub never compiles the app. This keeps billed macOS time
# to ~10 min/run instead of ~45.
#
# Pipeline:
#   1. Somebody (usually Claude, per the standing workflow) runs
#      `eas build --platform ios --profile ios-simulator --no-wait`
#      whenever app code changes. That build happens on EAS's Macs.
#   2. This workflow downloads the LATEST FINISHED ios-simulator build via
#      `eas build:list`, installs it on a simulator, runs the Maestro flows.
#
# Runs on every PR (owner's call). Caveat: the tested binary is the latest
# finished EAS sim build, which can lag the triggering commit if no fresh
# build was kicked. Treat this lane as a smoke check on the assembled app,
# not commit-exact validation (the Jest suite in test.yml is the
# commit-exact gatekeeper).
#
# Requires the EXPO_TOKEN repo secret (expo.dev → Account settings →
# Access tokens). Without it the job fails fast with a clear message.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-maestro:
    name: iOS Simulator + Maestro flows
    runs-on: macos-15
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — EXPO_TOKEN present
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create an access token at https://expo.dev/accounts/mealio/settings/access-tokens and add it as a repo secret named EXPO_TOKEN."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # eas-cli evaluates app.json config plugins (expo-image-picker, …),
      # which requires the project's node_modules even for read-only
      # commands like build:list.
      - name: Install npm dependencies
        run: npm ci

      - name: Download latest EAS simulator build
        run: |
          BUILD_JSON=$(npx eas-cli@latest build:list \
            --platform ios \
            --build-profile ios-simulator \
            --status finished \
            --limit 1 \
            --json --non-interactive)
          BUILD_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl // empty')
          BUILD_DATE=$(echo "$BUILD_JSON" | jq -r '.[0].completedAt // "unknown"')
          if [ -z "$BUILD_URL" ]; then
            echo "::error::No finished ios-simulator build found on EAS. Run: eas build --platform ios --profile ios-simulator"
            exit 1
          fi
          echo "Using EAS build completed at: $BUILD_DATE"
          curl -fsSL "$BUILD_URL" -o /tmp/mealio-sim.tar.gz
          mkdir -p /tmp/mealio-app
          tar xzf /tmp/mealio-sim.tar.gz -C /tmp/mealio-app
          APP_PATH=$(find /tmp/mealio-app -maxdepth 2 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found inside the EAS artifact."
            find /tmp/mealio-app -maxdepth 3 | head -20
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Install Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for devs in d.values() for dev in devs if 'iPhone' in dev['name']))")
          echo "Simulator UDID: $DEVICE_ID"
          echo "SIM_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install app on simulator
        run: xcrun simctl install "$SIM_UDID" "$APP_PATH"

      - name: Run Maestro flows
        run: maestro test tests/maestro/flows --format junit --output maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/

      - name: Screenshot on failure
        if: failure()
        run: xcrun simctl io booted screenshot failure-screenshot.png || true
        continue-on-error: true

      - name: Upload screenshot artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: failure-screenshot.png
