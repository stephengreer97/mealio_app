name: iOS Maestro

# Runs Maestro UI flows against an iOS Simulator on a free GitHub-hosted
# macOS runner. Triggered on PRs into main and on direct pushes to main.
#
# Cost note: macos-latest minutes are billed at 10x the standard rate on
# private GitHub Actions plans (~30 min run = ~300 effective minutes).
# Free tier on private repos is 2000 min/month, so this fits ~6-7 runs.
# Public repos are free — no quota concern.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual run

# Cancel an in-flight run if a new commit lands on the same branch.
concurrency:
  group: ios-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-maestro:
    name: iOS Simulator + Maestro flows
    runs-on: macos-14
    timeout-minutes: 35
    env:
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Generates the ios/ folder from the Expo managed config.
      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      # Cache CocoaPods derived deps so subsequent runs skip the slow install.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl create "Mealio Test iPhone" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-15" \
            "com.apple.CoreSimulator.SimRuntime.iOS-17-4" 2>/dev/null \
            || xcrun simctl list devices | grep -E "iPhone 15 " | head -1 | grep -oE "[A-F0-9-]{36}")
          echo "Simulator UDID: $DEVICE_ID"
          echo "SIM_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build for iOS Simulator
        run: |
          # Workspace name is derived from the slug in app.json ("mealio").
          xcodebuild \
            -workspace ios/Mealio.xcworkspace \
            -scheme Mealio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || (xcodebuild \
            -workspace ios/Mealio.xcworkspace \
            -scheme Mealio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO)

      - name: Install app on simulator
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 2 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

      # Maestro discovers and runs every .yaml in the flows folder.
      - name: Run Maestro flows
        run: maestro test tests/maestro/flows --format junit --output maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/

      - name: Upload simulator screenshot on failure
        if: failure()
        run: |
          xcrun simctl io booted screenshot failure-screenshot.png || true
        continue-on-error: true

      - name: Upload screenshot artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: failure-screenshot.png
