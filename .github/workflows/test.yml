name: Tests

# The main test suite: unit + component + fixture tests, all on cheap
# ubuntu runners. Runs on every push and PR. The expensive iOS Maestro
# workflow (ios-maestro.yml) is separate and only fires on PRs to main.

# Documentation cannot change what the suite tests, so a change touching only
# docs is not worth a run. The filter skips ONLY when every changed file
# matches it — docs alongside source still runs everything — and it is repeated
# under each event because a paths-ignore belongs to one trigger, not to `on`.
# workflow_dispatch deliberately has none: a manual run should always run.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-components:
    name: Unit + component tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # NOTE: the path pattern must come BEFORE --selectProjects — the flag
      # is variadic and would otherwise swallow the path as a project name.
      - name: Unit tests (node project)
        run: npx jest tests/unit --selectProjects node --ci

      - name: Component tests (jest-expo project)
        run: npx jest --selectProjects components --ci

  fixtures:
    name: Fixture tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner self-test also needs chromium, so it lives in this
          # matrix rather than the unit job.
          - name: runner
            spec: tests/fixture-runners/runScript.test.ts
          - name: heb
            spec: tests/fixture-tests/heb-network-search.spec.ts
          - name: albertsons
            spec: tests/fixture-tests/albertsons-network.spec.ts
          - name: aldi
            spec: tests/fixture-tests/aldi-network.spec.ts
          - name: wegmans
            spec: tests/fixture-tests/wegmans-network.spec.ts
          - name: walmart
            spec: tests/fixture-tests/walmart-network.spec.ts
          - name: blank-page-recovery
            spec: tests/fixture-tests/blank-page-recovery.spec.ts
          # EVERY ENTRY HERE NAMES A FILE THAT EXISTS, and the step below fails
          # loudly if one stops existing. This matrix spent weeks red because it
          # did not: three specs went with DOM automation (selector-drift,
          # parallel-workers, cart-count), one went with Amazon Fresh, and the
          # five store specs were RENAMED to *-network.spec.ts. `npx jest` on a
          # path matching nothing exits 1 with "no tests found", which reads as
          # a test failure -- so nine jobs failed on every push and the signal
          # was worth nothing.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Playwright needs its own chromium build + system libs.
      # Cache the browser binaries keyed on the playwright version.
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps only (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Fixture tests for ${{ matrix.name }}
        run: |
          # SAY WHICH FILE IS MISSING. `npx jest <path>` on a path matching
          # nothing exits 1 with "no tests found", which reads as a test failure
          # and sent everyone looking at the wrong thing. A matrix entry pointing
          # at a renamed or deleted spec is a WORKFLOW bug and should say so.
          if [ ! -f "${{ matrix.spec }}" ]; then
            echo "::error::${{ matrix.spec }} does not exist -- a matrix entry in this workflow names a spec that has been renamed or deleted."
            exit 1
          fi
          npx jest "${{ matrix.spec }}" --ci

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The baseline was 14 for the pre-existing errors in MealDetailSheet,
      # AccountScreen, MyMealsScreen and CreatorPortalScreen. Those are gone —
      # `npx tsc --noEmit --skipLibCheck` reports 0 — so the gate was allowing up
      # to 14 NEW type errors to land without failing. It is 0 now, which is what
      # the tree actually holds; raise it only alongside the errors it is covering.
      - name: Typecheck with baseline
        run: |
          BASELINE=0
          COUNT=$(npx tsc --noEmit --skipLibCheck 2>&1 | grep -cE "error TS" || true)
          echo "TypeScript errors: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::Type error count ($COUNT) exceeds baseline ($BASELINE) — new type errors introduced."
            npx tsc --noEmit --skipLibCheck 2>&1 | grep -E "error TS" | head -40
            exit 1
          fi
