        - generic [ref=f2e25]:
          - heading "Why this epic exists" [level=2] [ref=f2e26]
          - paragraph [ref=f2e27]:
            - text: Cart automation
            - emphasis [ref=f2e28]: is
            - text: "the product. Meals, creators, discovery — all of it is upstream of one moment: the user taps add-to-cart and the ingredients land in their real cart at their real store. That moment is unreliable for five of our seven store families today, and we cannot currently say"
            - strong [ref=f2e29]: how
            - text: unreliable or
            - strong [ref=f2e30]: where
            - text: it breaks, because the per-step funnel we already emit is not aggregated anywhere.
          - paragraph [ref=f2e31]: Two structural facts drive everything below.
          - paragraph [ref=f2e32]:
            - strong [ref=f2e33]: 1. We run one rail for five store families.
            - text: "DOM automation is the most fragile integration that exists: it breaks on any markup change, it is fingerprintable by bot defenses, and it only ever gives us"
            - emphasis [ref=f2e34]: inferential
            - text: confirmation that an add succeeded (we watch a badge counter tick). Kroger runs on a public API and is flawless. That is not a coincidence — it is the whole thesis.
          - paragraph [ref=f2e35]:
            - strong [ref=f2e36]: 2. We maintain two implementations that drift apart.
            - code [ref=f2e37]: mealio_app/src/lib/webview-scripts/
            - text: (~6,000 lines) and
            - code [ref=f2e38]: mealio_ext/content-*.js
            - text: (~14,400 lines) each implement per-store automation independently. The app hot-patches selectors through remote config; the extension needs a Chrome Web Store review to ship the same fix. One breakage costs us twice and heals at two speeds.
          - heading "Thesis" [level=2] [ref=f2e39]
          - paragraph [ref=f2e40]: "Reliability here is not a bug-fix campaign. It comes from two things:"
          - list [ref=f2e41]:
            - listitem [ref=f2e42]:
              - strong [ref=f2e43]: Climbing the rail ladder.
              - text: Every store moves to the highest-fidelity integration available to it.
            - listitem [ref=f2e44]:
              - strong [ref=f2e45]: Closing the loop.
              - text: measure → detect → heal → verify, running continuously, so breakage is caught by CI and remote config instead of by users.
          - heading "The rail ladder" [level=2] [ref=f2e46]
          - table [ref=f2e47]:
            - rowgroup [ref=f2e48]:
              - row [ref=f2e49]:
                - columnheader "Rail" [ref=f2e50]
                - columnheader "Fidelity" [ref=f2e51]
                - columnheader "Where we are" [ref=f2e52]
            - rowgroup [ref=f2e53]:
              - row [ref=f2e54]:
                - cell "1 · Sanctioned API" [ref=f2e55]
                - cell "Highest" [ref=f2e56]
                - cell "Kroger family ✅ · Walmart pending" [ref=f2e57]
              - row [ref=f2e58]:
                - cell "2 · Sanctioned cart link" [ref=f2e59]
                - cell "Very high" [ref=f2e60]
                - cell "Walmart affiliate ATC (untested), Amazon (likely dead)" [ref=f2e61]
              - row [ref=f2e62]:
                - cell "3 · In-page network layer" [ref=f2e63]
                - cell "High" [ref=f2e64]
                - cell [ref=f2e65]:
                  - strong [ref=f2e66]: Target
                  - text: for HEB, Albertsons, Instacart storefronts
              - row [ref=f2e67]:
                - cell "4 · DOM automation" [ref=f2e68]
                - cell "Lowest" [ref=f2e69]
                - cell "Everything else today" [ref=f2e70]
          - paragraph [ref=f2e71]:
            - strong [ref=f2e72]: Rail 3 is the central move.
            - text: Inside the WebView we already trust,
            - code [ref=f2e73]: fetch()
            - text: the store's own JSON/GraphQL endpoints using the user's own session. Cookies and bot tokens are applied by the browser automatically — we never see or handle them. It eliminates selector drift, sponsored-carousel contamination, click races, and badge-count guessing in a single step, and it returns typed per-item confirmation so we know exactly
            - emphasis [ref=f2e74]: which
            - text: ingredient failed.
          - paragraph [ref=f2e75]:
            - text: "Note the distinction that makes this workable: we cannot"
            - strong [ref=f2e76]: observe
            - text: the store's network traffic from a React Native WebView (no CDP, no request log). We do not need to. We only need to
            - strong [ref=f2e77]: originate
            - text: requests, which
            - code [ref=f2e78]: injectJavaScript
            - text: already does. Discovering
            - emphasis [ref=f2e79]: what
            - text: to call is an offline, one-time activity on a dev machine with Playwright — never something the shipped app does.
          - heading "Non-goals and hard constraints" [level=2] [ref=f2e80]
          - list [ref=f2e81]:
            - listitem [ref=f2e82]:
              - strong [ref=f2e83]: Retail partnerships are not available at our size.
              - text: Not a path; stop costing it.
            - listitem [ref=f2e84]:
              - strong [ref=f2e85]: The Instacart Developer Platform is off the table.
              - text: All Instacart Storefront work in this epic is automation of the user's own session, exactly like any other store — not a sanctioned API, and it should not be described as one.
            - listitem [ref=f2e86]:
              - strong [ref=f2e87]: No first-party client impersonation.
              - text: We will not use a retailer's own mobile OAuth
              - code [ref=f2e88]: client_id
              - text: or spoof their app's user agent. Automating a session the user opened themselves is one thing; asserting an identity that isn't ours to a security system is a materially different category of risk, and it is the single item here that would read badly in diligence.
            - listitem [ref=f2e89]:
              - strong [ref=f2e90]: No before-content DOM/localStorage tampering on iOS.
              - text: We already learned this the expensive way — see the comment at
              - code [ref=f2e91]: WebViewCartSheet.tsx:200
              - text: . Patching
              - code [ref=f2e92]: window.fetch
              - text: to sniff the page's own requests is a canonical PerimeterX/Imperva fingerprint check. Discovery stays offline.
          - heading "Phases" [level=2] [ref=f2e93]
          - paragraph [ref=f2e94]:
            - strong [ref=f2e95]: Phase 0 — See it.
            - text: Aggregate the funnel we already emit, define the north-star metric, classify every failure.
            - emphasis [ref=f2e96]: Nothing else in this epic should start first
            - text: — without it, every priority call below is a guess.
          - paragraph [ref=f2e97]:
            - strong [ref=f2e98]: Phase 1 — Stop the bleeding.
            - text: Nightly live canaries with remote auto-disable, so a broken store is caught by CI and switched off before users hit it. Graceful degradation so a failure is never a dead end.
          - paragraph [ref=f2e99]:
            - strong [ref=f2e100]: Phase 2 — Climb.
            - text: Move HEB and Albertsons to rail 3. Cheaply test the rail-2 candidates and kill them fast if dead.
          - paragraph [ref=f2e101]:
            - strong [ref=f2e102]: Phase 3 — Consolidate and expand.
            - text: One Instacart Storefront adapter — already ~80% built as
            - code [ref=f2e103]: aldi.ts
            - text: — covering ALDI, Publix, Sprouts, Costco, with a path to ~380 more storefronts. Server-driven store catalog. Bring the extension onto the app's remote config.
          - paragraph [ref=f2e104]:
            - strong [ref=f2e105]: Phase 4 — Match quality.
            - text: Selector healing addresses only ~28% of automation failures industry-wide. Getting the
            - emphasis [ref=f2e106]: right product
            - text: is a separate discipline and needs its own evaluation harness.
          - heading "Definition of done" [level=2] [ref=f2e107]
          - list [ref=f2e108]:
            - listitem [ref=f2e109]: Per-store, item-level cart success rate is on a dashboard and refreshed daily.
            - listitem [ref=f2e110]: Every store family has a nightly canary that can disable it remotely, no release.
            - listitem [ref=f2e111]: No store family runs on DOM automation where a network rail exists.
            - listitem [ref=f2e112]: A failed add never dead-ends the user.
            - listitem [ref=f2e113]: Selector and endpoint contracts live in exactly one place, shared by app and extension.
