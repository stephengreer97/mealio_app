            - article [ref=e326]:
              - generic [ref=e327]:
                - paragraph [ref=e328]: I love this recipe. It has been my go-to banana bread recipe for years. I normally use melted butter and yogurt instead of the coconut products and add cinnamon and nutmeg. It’s always delicious.
                - paragraph [ref=e329]:
                  - text: Just recently when I went to make it I realized that I was out of whole wheat flour so I looked through what I had on hand and saw that a bag of Bob’s Red Mill buckwheat flour suggested swapping half the wheat flour in a recipe with the buckwheat for a “unique nutlike flavor.” Going with the nut vibe, I used a half cup of the buckwheat and a half cup of almond flour along with the one cup of AP flour. I was worried that the almond flour might make the bread a bit dry, so I also added one tablespoon of almond milk. I also added chocolate chips. It came out great! I would 10/10 try this combo again.
                  - img "5 stars" [ref=e330]
                - paragraph
                - generic [ref=e331]: Julie
            - list [ref=e332]:
