              - paragraph [ref=e129]: I tend to have leftover coconut milk on hand, so that is what I use here (along with coconut oil). They both compliment banana beautifully, but I offer up a range of easy, everyday substitutions in the ingredient list if you don't have either of those on hand.
              - generic [ref=e130]: Ingredients
              - list [ref=e133]:
                - listitem [ref=e134]: 1 1/2 cups / 12 oz / 340 g mashed RIPE bananas (~3 bananas)
                - listitem [ref=e135]: 1/3 cup / 80 ml melted coconut oil or melted butter
                - listitem [ref=e136]: 3/4 cup / 4.5 oz / 125 g dark muscovado or dark brown sugar
                - listitem [ref=e137]: 1/4 cup / 60 ml full-fat coconut milk or yogurt, or sour cream
                - listitem [ref=e138]: 2 large eggs lightly beaten
                - listitem [ref=e139]: 1 teaspoon vanilla extract
                - listitem [ref=e140]: 1 cup / 4.5 oz / 125g all-purpose flour
                - listitem [ref=e141]: 1 cup / 5 oz / 140g whole wheat flour
                - listitem [ref=e142]: 3/4 teaspoon baking soda
                - listitem [ref=e143]: 1/2 teaspoon fine grain sea salt
              - generic [ref=e144]:
                - generic [ref=e145]: Instructions
                - list [ref=e147]:
                  - listitem [ref=e148]:
                    - paragraph [ref=e150]: Preheat the oven to 350°F, and place a rack in the center. Oil a 9-by 5-inch (23 x 13 cm) loaf pan, or equivalent.
                - generic [ref=e151]:
                  - generic [ref=e152]: Make the Batter
                  - list [ref=e153]:
                    - listitem [ref=e154]:
                      - paragraph [ref=e156]: Next, place the mashed bananas in a large bowl. Stir in the coconut oil, and then the brown sugar and coconut milk. Add the eggs and vanilla, and stir until well combined. Add the flours, baking soda, and salt (sprinkling the baking soda and salt across the surface of the batter), and mix just until the batter combines, avoid over-mixing.
                - generic [ref=e157]:
                  - generic [ref=e158]: Bake and Cool
                  - list [ref=e159]:
                    - listitem [ref=e160]:
                      - paragraph [ref=e162]: Pour the batter into the prepared pan and bake until golden brown, about 50 minutes. Transfer the pan to a wire rack to cool in the pan for 10 minutes, then turn the loaf out of the pan to cool completely. Slice, and enjoy!
