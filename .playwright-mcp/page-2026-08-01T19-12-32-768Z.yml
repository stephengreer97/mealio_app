                - generic [ref=e334]:
                  - paragraph [ref=e335]: Julie! Thanks so much for your notes. I love this swap and it sounds absolutely delicious. Thanks for reporting back!
                  - paragraph
                  - generic [ref=e336]: Heidi Swanson
            - article [ref=e337]:
              - generic [ref=e338]:
                - paragraph [ref=e339]:
                  - text: Happy new year, Heidi! I made this bread, but with some substitutions and additions based on what I had on hand, and to make it edible for a family member who has Alpha-Gal syndrome (and therefore can’t have any mammal-sourced dairy). Used half all-purpose and half pastry flour, substituted one 5.4-oz. can (2/3 cup) of coconut cream for the coconut oil and milk, and added two tablespoons of molasses (to compensate for not having dark brown sugar). Because I had slightly less banana than needed, I added about 1/4 cup of leftover pumpkin puree. I also added 1/2 cup of sprouted, salted pecans and walnuts. I was concerned that the coconut cream might not provide enough fat, but the resulting bread is delicious. It’s very moist (but not wet), and I couldn’t taste either the coconut or pumpkin. That said, I had to bake it for over an hour (perhaps just because of my oven, and the heavy stainless steel loaf pan I was using). I would use the coconut cream again for this recipe.
                  - img "5 stars" [ref=e340]
