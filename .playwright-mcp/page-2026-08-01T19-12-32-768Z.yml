        - generic [ref=e42]:
          - paragraph [ref=e43]: Give this banana bread recipe a go! It's perfect if you're craving classic banana bread flavor and texture, but want as little mess, drama, and equipment as possible. Quite honestly, it's the best, simple, one-bowl banana bread I know. No mixer, a single bowl, classic flavor, and a moist and tender crumb. If you have three ripe bananas on hand, chances are good you have the rest of the ingredients as well. Let's do this!
          - paragraph [ref=e44]:
            - img "One Bowl Banana Bread Recipe" [ref=e45]
          - heading "My Favorite Banana Bread" [level=2] [ref=e46]
          - paragraph [ref=e47]:
            - text: What you'll get here is a straight-ahead, classic banana bread, with a hint of a wholesome twist. I like my baked goods to have a rustic touch to them, which is why I like to use some whole wheat flour and brown sugar here. Consequently, it makes your banana bread more nutritious, moist, extra special, and delicious (when compared to versions with white sugar and white flour).
            - img "Banana Bread Ingredients" [ref=e48]
          - heading "Inspiration" [level=2] [ref=e49]
          - paragraph [ref=e50]:
            - text: This particular banana bread recipe evolved into its current lazy-day state from
            - link "this Melissa Clark gem" [ref=e51] [cursor=pointer]:
              - /url: https://www.101cookbooks.com/archives/lemony-olive-oil-banana-bread-recipe.html
            - text: . I skipped any add-ins for simplicity's sake here, and would recommend a
            - emphasis [ref=e52]: banana-only
            - text: first pass. See how you like it, and then play around with some of my suggested variations (below) on a future pass.
          - heading "Tips" [level=2] [ref=e53]
          - paragraph [ref=e54]: My pro tips are few. Number one, use extra-ripe bananas. I love the sweetness and depth of flavor they bring to the banana bread. Number two? Don't over mash your banana in the beginning, leave them a quite bit chunky. You want some of those chunks to remain until the end. They tend to really break down as you're stirring in ingredients. Lastly, avoid over baking. Moist banana bread is the goal.
          - paragraph [ref=e55]:
            - img "One Bowl Banana Bread Recipe" [ref=e56]
          - heading "Variations" [level=2] [ref=e57]
          - paragraph [ref=e58]:
            - strong [ref=e59]: "Add-ins:"
            - text: What you see here (above) is a classic, banana bread. No add-ins. No chunks. That said, don't let me stop you if you like the base recipe, and want to add in a couple of handfuls of toasted walnuts, chocolate chunks, or some citrus zests, herbs, or toasted coconut. You can also play around with simple glazes.
            - strong [ref=e60]: Brown butter
            - text: ": On occasion, I like to brown the butter in this recipe before using it. So good."
            - strong [ref=e61]: Toppings
            - text: ": You can finish your banana bread a bunch of different ways. There's the basic, no-frills version pictured directly above. Another idea? Press half a banana lengthwise into the batter before baking. Sprinkle generously with brown sugar and bake. You can see this version in the lead photo."
          - 'heading "Watch: One Bowl Banana Bread Video" [level=2] [ref=e62]'
          - paragraph [ref=e63]:
            - text: Also(!), if you like this, I'd be willing to bet you'll also like these banana-packed
