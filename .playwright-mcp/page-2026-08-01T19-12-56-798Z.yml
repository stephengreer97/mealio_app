          - figure [ref=f203e205]
          - paragraph [ref=f203e208]: If it’s good enough for a Queen, it’s good enough for me.
          - paragraph [ref=f203e209]:
            - text: I’m talking about the crisp, chewy crust; the tangy, pure sauce; the rich, smooth mozzarella; and best of all — the strong, inimitable flavour of fresh basil leaves. These are the ingredients that make up
            - strong [ref=f203e210]: Margherita Pizza
            - text: ", a pizza created for the Queen of Savoy in the late 19th century."
          - paragraph [ref=f203e211]: Pizza was around before then, and has changed greatly since, but in my eyes (and according to my tastebuds) it reached perfection with the Margherita.
          - paragraph [ref=f203e212]:
            - text: Without a wood-fired oven and a special type of dough, as specified by the
            - link [ref=f203e213] [cursor=pointer]:
              - /url: http://www.pizzanapoletana.org/eng_chisiamo.php
              - emphasis [ref=f203e214]: Associazione Vera Pizza Napoletana
            - text: ", it’s tough to make true"
            - emphasis [ref=f203e215]: Naploetana
            - text: Margherita pizza. But you can do your best to get as close to it as possible, with a regular oven and homemade dough.
          - paragraph [ref=f203e216]:
            - text: The recipe below has been adapted from one featured on
            - emphasis [ref=f203e217]: Emeril Lagasse’s
            - link [ref=f203e218] [cursor=pointer]:
              - /url: http://www.foodnetwork.com/recipes/emeril-lagasse/pizza-margherita-recipe/index.html
              - emphasis [ref=f203e219]: The Essence of Emeril.
            - text: It’s a great recipe that is easy to make (but isn’t quick — be sure to factor in about an hour and a half for prep time), and turns out great when using it for Margherita pizza. The crust ends up being quite thin and crispy; all that is missing is the unmistakable slight char that a wood oven provides.
          - figure [ref=f203e220]
          - paragraph [ref=f203e223]:
            - strong [ref=f203e224]:
              - emphasis [ref=f203e225]: What’s your favourite kind of pizza? Do you make it at home or prefer to go out? Favourite toppings?
          - figure [ref=f203e226]
          - paragraph [ref=f203e229]:
            - strong [ref=f203e230]:
              - text: Basic Pizza Dough
              - emphasis [ref=f203e231]: Adapted from
            - link [ref=f203e232] [cursor=pointer]:
              - /url: http://www.foodnetwork.com/recipes/emeril-lagasse/pizza-margherita-recipe/index.html
              - strong [ref=f203e233]:
                - emphasis [ref=f203e234]: Emeril Lagasse
            - strong [ref=f203e235]: Makes 2–12” thin crust pizzas
          - paragraph [ref=f203e236]:
            - strong [ref=f203e237]: "Ingredients:"
            - text: 1 cup warm water1 package (or 2 ¼ teaspoons) active dry yeast1 ½ teaspoons sea salt1 ½ tablespoons extra virgin olive oil2 ½ cups all purpose flour
          - paragraph [ref=f203e238]:
            - strong [ref=f203e239]: "Instructions:"
            - text: 1) In a large bowl stir water, yeast, and salt together. Let sit for 5–10 minutes, or until the mixture begins to foam.
          - paragraph [ref=f203e240]: 2) Add oil and 2 cups flour and stir. If using an electric mixer, use dough hook attachment and mix on low. Otherwise, turn the mixture out onto a lightly floured surface and begin to knead, until smooth and elastic. With either method, add more flour as necessary (the dough should not be sticky).
          - paragraph [ref=f203e241]: 3) Shape the dough into a ball and place in a large, oiled bowl. Toss a few times to coat and cover with a damp towel. Place in a warm, draft free spot (in the oven with the door closed and the light on works well), and let rise for about an hour, or until doubled in size.
          - paragraph [ref=f203e242]: 4) Preheat oven to 500 degrees Fahrenheit and lightly oil two pizza pans (or cookie sheets if you want even thinner crust). Divide the dough into two equal sized portions and form into balls. Place them on one of the prepared baking sheets and cover with the damp towel; let sit for 15 minutes.
          - paragraph [ref=f203e243]: 5) Transfer the portions of dough to a floured surface and, one at a time, roll them out to fit the prepared pans (dough should be between 1/8 inch and ¼ inch in thickness).
          - figure [ref=f203e244]
          - paragraph [ref=f203e247]:
            - strong [ref=f203e248]: "To Make Margherita Pizza:"
            - text: Cover the rolled out dough with strained tomatoes (find them near the canned tomatoes at the grocery store — usually in tall glass jars), leaving a border of 1 inch around the edges, and then drizzle with first cold press extra virgin olive oil. Scatter fresh, shredded basil leaves (you’ll need about 20 for two pizzas. Reserve a few extras for garnish once the pizzas are cooked), and slices of mozzarella (use buffalo mozzarella, if possible — otherwise use a ball of good quality mozzarella). Cook in preheated oven, one at a time, for 8–10 minutes or until crust begins to brown slightly and cheese is bubbling. Garnish with fresh basil and serve immediately.
          - figure [ref=f203e249]
