          - heading "EQUIPMENT" [level=2] [ref=f210e395]
          - list [ref=f210e396]:
            - listitem [ref=f210e397]: 1 Medium Stockpot or Instant Pot with SAUTE mode
            - listitem [ref=f210e398]: 3 8 ounce Jelly Jars or other air-tight containers
            - listitem [ref=f210e399]: 1 Canning Funnel
            - listitem [ref=f210e400]: 1 Blender or Food Processor
            - listitem [ref=f210e401]: 1 Digital Gram Scale optional
          - heading "INGREDIENTS" [level=2] [ref=f210e402]
          - heading "US CustomaryMetric" [level=2] [ref=f210e403]
          - heading "1x2x3x" [level=2] [ref=f210e404]
          - list [ref=f210e405]:
            - listitem [ref=f210e406]: 4 cups fresh blackberries
            - listitem [ref=f210e407]: 3/4 cup honey, can reduce to taste if needed.
            - listitem [ref=f210e408]: 2 T fresh lemon juice
            - listitem [ref=f210e409]: 1/4 cup chia seeds
          - heading "INSTRUCTIONS" [level=2] [ref=f210e410]
          - list [ref=f210e411]:
            - listitem [ref=f210e412]: Place the blackberries, honey, and lemon juice into your blender or food processor.
            - listitem [ref=f210e413]:
              - text: Pulse several times until you reach the consistency you desire. Do not fully blend unless you want a VERY smooth jam.
              - strong [ref=f210e414]: "NOTE:"
              - text: The color will be lighter and less vibrant if you blend it until smooth vs. pulsing.
            - listitem [ref=f210e415]:
              - text: Pour the puree into your medium stockpot or instant pot on SAUTE mode (
              - emphasis [ref=f210e416]: be careful to adjust heat on the instant pot as needed, this works in a pinch if your stove top is unavailable
              - text: )
            - listitem [ref=f210e417]: Simmer to a light boil, stirring frequently to prevent burning. When it reaches the boil, lower the heat to medium-low to low and gently simmer & stir for 8–10 minutes.
            - listitem [ref=f210e418]: When it is done cooking, turn off the heat and stir in the chia seeds. Pour into the prepared jars while hot and set aside to cool before placing the lids on and refrigerating and/or freezing. (see notes below)
