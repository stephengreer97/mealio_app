                    - text: ", for topping"
                    - strong [ref=f235e302]: "Notes:"
                - paragraph [ref=f235e304]:
                  - generic [ref=f235e305]: "*I used 1/2 cup dried TVP and soaked them in hot water for at least 10 minutes before squeezing out the excess liquid."
                - paragraph [ref=f235e307]:
                  - generic [ref=f235e308]: "*Mushrooms like button, shiitake, oyster would work well!"
                - paragraph [ref=f235e310]:
                  - generic [ref=f235e311]:
                    - strong [ref=f235e312]: Sauce
                    - text: 1/4 cup
                    - link "soy sauce" [ref=f235e313] [cursor=pointer]:
                      - /url: https://amzn.to/2RyGHAf
                    - text: 1 cup water 1 1/2 tbsp
                    - link "hoisin sauce" [ref=f235e315] [cursor=pointer]:
                      - /url: https://amzn.to/2DYTcNu
                    - text: "* 3 tbsp sugar, adjust according to desired sweetness (I used coconut sugar) 1 tbsp"
                    - link "sesame oil" [ref=f235e317] [cursor=pointer]:
                      - /url: https://amzn.to/2YxWsZJ
                    - text: 2 tsp
                    - link "sriracha" [ref=f235e319] [cursor=pointer]:
                      - /url: https://amzn.to/2s7LwFU
                    - text: ", adjust according to desired spice (optional) 1/4 tsp pepper 1 tbsp cornstarch + 2 tbsp room temp. water, mixed into a slurry"
                - paragraph [ref=f235e325]:
                  - strong [ref=f235e327]: "*Note:"
                - paragraph [ref=f235e329]:
                  - generic [ref=f235e330]: "If you don’t have hoisin sauce, feel free to sub with:"
                - paragraph [ref=f235e332]:
                  - generic [ref=f235e333]: Option 1 - 1 tbsp tomato ketchup mixed with 1/2 tbsp soy sauce and a adjust the sugar in the sauce mix.
                - paragraph [ref=f235e335]:
                  - generic [ref=f235e336]:
                    - text: Option 2 - equal amount (1 1/2 tbsp) teriyaki sauce (Check out my
                    - link "homemade recipe here" [ref=f235e337] [cursor=pointer]:
