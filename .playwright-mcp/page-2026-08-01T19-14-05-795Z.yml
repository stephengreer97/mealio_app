                - paragraph [ref=f235e285]:
                  - generic [ref=f235e286]: Good for 2-3 servings
                - heading [level=2] [ref=f235e288]:
                  - strong [ref=f235e290]: Ingredients
                - paragraph [ref=f235e292]:
                  - generic [ref=f235e293]:
                    - text: 200g dry spaghetti or other pasta of choice 2 cloves garlic, minced 1 small onion, diced Chopped leeks, plus more for garnishing (optional) 1 small red bell pepper, diced (optional) 2 tbsp
                    - link "sesame oil" [ref=f235e294] [cursor=pointer]:
                      - /url: https://amzn.to/2YxWsZJ
                    - text: Pinch of salt, or to taste 1 cup rehydrated
                    - link "TVP" [ref=f235e296] [cursor=pointer]:
