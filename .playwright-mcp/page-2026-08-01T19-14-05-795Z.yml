                    - text: )
                - heading [level=2] [ref=f235e340]:
                  - strong [ref=f235e342]: Steps
                - list [ref=f235e344]:
                  - listitem [level=1] [ref=f235e345]:
                    - paragraph [ref=f235e346]:
                      - generic [ref=f235e347]: Mix all the sauce ingredients in a bowl, except the cornstarch slurry. Feel free to adjust seasoning depending on desired taste. Set aside.
                  - listitem [level=1] [ref=f235e348]:
                    - paragraph [ref=f235e349]:
                      - generic [ref=f235e350]: Heat a pot with water. Cook pasta until chewy or al dente.
                  - listitem [level=1] [ref=f235e351]:
                    - paragraph [ref=f235e352]:
                      - generic [ref=f235e353]: While pasta is cooking, heat a pan. Add in 2 tbsp sesame oil. Once hot, sauté the onion and leeks (if using). Add in the garlic and bell peppers (if using) then sauté until tender. Add in the TVP/lentils/mushrooms then sauté for 2-3 minutes.
                  - listitem [level=1] [ref=f235e354]:
                    - paragraph [ref=f235e355]:
                      - generic [ref=f235e356]: Pour in the sauce and leave to simmer over medium heat.
                  - listitem [level=1] [ref=f235e357]:
                    - paragraph [ref=f235e358]:
                      - generic [ref=f235e359]: Once the sauce boils, add in the cornstarch slurry. Continuously mix until the sauce starts to thicken.
                  - listitem [level=1] [ref=f235e360]:
                    - paragraph [ref=f235e361]:
                      - generic [ref=f235e362]: Add in the spaghetti and cook until it has absorbed some of the sauce. Season with a pinch of salt, or more as needed. Mix then turn off heat.
                  - listitem [level=1] [ref=f235e363]:
                    - paragraph [ref=f235e364]:
                      - generic [ref=f235e365]: Top with some leeks and sesame seeds, if desired. Enjoy while hot!
