# Mealio: full meal-to-cart flow on Wegmans
#
# Pre-reqs:
#   - Logged in (run login.yaml first, or rely on persisted session)
#   - At least one saved meal in My Meals
#   - Wegmans is selected as the active store
#
# Verifies the end-to-end flow that triggered most of this session's bugs:
#   1. Open a saved meal
#   2. Tap "Add to Cart"
#   3. WebViewCartSheet opens, runs login_check, finds you logged in
#   4. (Parallel worker pool if all-choose, or sequential for already-decided)
#   5. Review screen appears with candidates per ingredient
#   6. Pick the suggested products, advance through the review
#   7. ATC step runs, shows the in-cart confirmation
#   8. Tap "Done" / "Continue Shopping"

appId: host.exp.Exponent
---
- launchApp

# Navigate to My Meals tab.
- tapOn: "My Meals"

# Open the first saved meal (assume there's at least one).
- tapOn:
    childOf: { id: "mealList" }   # falls back to first-meal-tap if id not set
    index: 0
    optional: true
- runFlow:
    when:
      notVisible: "Add to Cart"
    commands:
      # Fallback if the meal card didn't open via the above selector.
      - tapOn: { text: ".*", index: 0 }   # tap the first list item

# Tap Add to Cart.
- assertVisible: "Add to Cart"
- tapOn: "Add to Cart"

# Confirm/select Wegmans if a store-picker appears.
- runFlow:
    when:
      visible: "Choose a store"
    commands:
      - tapOn: "Wegmans"

# Wait for the WebView cart sheet to open and progress past login_check.
# In a normal run, the user reaches "Searching N ingredients..."
- assertVisible:
    text: "Searching"
    timeout: 30000

# Wait for the review screen.
- assertVisible:
    text: "Review"
    timeout: 60000   # parallel pool needs ~30s for 6 ingredients including page loads

# Walk through each review screen — accept the suggested top match for each.
# Maestro's `repeat` lets us tap "Add" repeatedly until the review queue is done.
- repeat:
    times: 8   # cover up to 8 ingredients
    commands:
      - runFlow:
          when:
            visible: "Add to cart"
          commands:
            - tapOn: "Add to cart"
            - waitForAnimationToEnd

# Final "Done" / success screen.
- assertVisible:
    text: "added to cart"
    timeout: 120000
- tapOn: "Done"
