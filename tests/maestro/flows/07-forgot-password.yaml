# Forgot-password navigation: the reset screen is reachable from login and
# renders its form. Does not submit (would send a real email).

appId: co.mealio.app
---
- launchApp:
    clearState: true
    # The first-run flags live in expo-secure-store, which clearState does
    # NOT touch. Without this, whichever flow ran first dismissed the welcome
    # sheet for all the others and they stopped being independent.
    clearKeychain: true
    stopApp: true

# First run covers Discover with the welcome sheet. See the subflow.
- runFlow: ../subflows/dismiss-welcome.yaml

- assertVisible: "Trending Meals"
- tapOn: "Sign In"
- assertVisible: "Welcome back"
- tapOn: "Forgot password?"
- assertVisible: "Reset password"
- assertVisible: "you@example.com"
- assertVisible: "Send Reset Link"
