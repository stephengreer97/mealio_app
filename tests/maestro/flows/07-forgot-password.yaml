# Forgot-password navigation: the reset screen is reachable from login and
# renders its form. Does not submit (would send a real email).

appId: co.mealio.app
---
- launchApp:
    clearState: true
    stopApp: true

- assertVisible: "Trending Meals"
- tapOn: "Sign In"
- assertVisible: "Welcome back"
- tapOn: "Forgot password?"
- assertVisible: "Reset password"
- assertVisible: "you@example.com"
- assertVisible: "Send Reset Link"
