# Mock-store NO RESULTS → SKIP: a meal whose ingredient term contains "noresults"
# returns 0 candidates, so the engine surfaces the review sheet with no products.
# Use "Skip this ingredient" and confirm the run finishes (skipped item noted).
#
# SCAFFOLD — see tests/mock-store/README.md (deps: dev build, test account, a
# seeded `mockstore` meal with a "...noresults" ingredient, mock server on :8788).
# TODO(tomorrow): confirm testIDs/labels against the real cart-sheet UI.

appId: co.mealio.app
env:
  EMAIL: ${MEALIO_TEST_EMAIL}
  PASSWORD: ${MEALIO_TEST_PASSWORD}
---
- launchApp:
    clearState: true
    stopApp: true
# --- sign in + open the seeded "noresults" meal (same preamble as 10) ---
- tapOn: "Sign In"
- tapOn: { id: "login-email" }
- inputText: ${EMAIL}
- tapOn: { id: "login-password" }
- inputText: ${PASSWORD}
- tapOn: "Log In"
- tapOn: "My Meals"
- extendedWaitUntil: { visible: { id: "meal-card-0" }, timeout: 15000 }
- tapOn: { id: "meal-card-0" }
- tapOn: "Add to Cart"
- tapOn: "Mock Store"

# No products found → review with a Skip affordance.
- extendedWaitUntil:
    visible: "No products found"   # TODO confirm copy
    timeout: 30000
- assertVisible: "Skip this ingredient"
- tapOn: "Skip this ingredient"

- extendedWaitUntil:
    visible: "Done"
    timeout: 60000
