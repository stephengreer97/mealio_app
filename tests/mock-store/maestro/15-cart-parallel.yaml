# Mock-store PARALLEL: a seeded meal with several default-term ingredients →
# the engine adds them via the parallel worker pool → all land in the cart.
#
# Seed: meal "E2E Parallel" at "Mock Store" with 4+ default-term ingredients
# (e.g. milk, eggs, bread, butter) — all exact matches → auto-add, no interaction.

appId: co.mealio.app
env:
  EMAIL: ${MEALIO_TEST_EMAIL}
  PASSWORD: ${MEALIO_TEST_PASSWORD}
---
- launchApp: { clearState: true, clearKeychain: true, stopApp: true }

# Sign in (see flow 10 for why each step is shaped this way).
- tapOn: "Sign In"
- tapOn: { id: "login-email" }
- inputText: ${EMAIL}
- tapOn: { id: "login-password" }
- inputText: ${PASSWORD}
- pressKey: Enter
- tapOn: { id: "login-submit" }

# Reach My Meals → Mock Store, select the seeded meal, confirm the review sheet,
# then handle the store webview login + one-time popup.
- extendedWaitUntil: { visible: "Trending Meals", timeout: 20000 }
- tapOn: { id: "tab-mymeals" }
- extendedWaitUntil: { visible: "Mock Store", timeout: 15000 }
- tapOn: "Mock Store"
- tapOn: { id: "meal-card-E2E Parallel" }
- tapOn: { id: "floating-add-to-cart" }
- extendedWaitUntil: { visible: "Add Ingredients to Mock Store Cart.*", timeout: 15000 }
- tapOn: "Add Ingredients to Mock Store Cart.*"
- runFlow:
    when: { visible: "Sign In" }
    commands: [{ tapOn: "Sign In" }]
- runFlow:
    when: { visible: "Got it" }
    commands: [{ tapOn: "Got it" }]

- extendedWaitUntil: { visible: { id: "cart-status-bubble" }, timeout: 30000 }
- extendedWaitUntil: { notVisible: { id: "cart-progress-fill" }, timeout: 90000 }
- tapOn: { id: "cart-status-bubble" }
- assertVisible: { id: "cart-row-added" }
- assertNotVisible: "could not be added"
